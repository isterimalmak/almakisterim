# Telefon uygulamasını (apps/mobile, Expo) Google Play için derler: Expo'nun bulutunda (EAS). Yalnızca elle başlatılır:
# GitHub > Actions > "Android (Google Play)" > Run workflow (main).
# Gereken tek gizli değer: EXPO_TOKEN (expo.dev > Account settings > Access tokens), GitHub > Settings > Secrets and variables > Actions'a
# sahibi kendisi girer. Değer bu dosyada ve log'da görünmez. İmza anahtarı ilk derlemede Expo'da oluşturulur ve orada saklanır.
name: Android (Google Play)

on:
  workflow_dispatch:
    inputs:
      submit:
        description: "Derlemeden sonra Google Play'e (dahili test) gönder — ilk sürüm Play Console'a elle yüklendikten sonra açılabilir"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Yetki kontrolü
        working-directory: .
        env:
          KIM: ${{ github.triggering_actor }}
          DAL: ${{ github.ref }}
        run: |
          [[ "$KIM" == "isterimalmak" || "$KIM" == "coskungulerlokalusta" ]] || { echo "::error::Bu hesap derleme başlatamaz: $KIM"; exit 1; }
          [[ "$DAL" == "refs/heads/main" ]] || { echo "::error::Derleme yalnızca main dalından yapılır."; exit 1; }
          [ -n "$EXPO_TOKEN" ] || { echo "::error::EXPO_TOKEN tanımlı değil. GitHub > Settings > Secrets and variables > Actions > New repository secret: EXPO_TOKEN"; exit 1; }

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bağımlılıklar ve tip denetimi
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit

      - name: Expo projesine bağla
        run: |
          # projectId app.json'da yoksa Expo hesabında "almakisterim" projesi açılır ya da var olana bağlanır
          npx --yes eas-cli@25 init --non-interactive --force
          id=$(node -p "require('./app.json').expo.extra.eas.projectId || ''")
          echo "PROJECT_ID=$id" >> "$GITHUB_ENV"
          echo "Expo proje numarası: $id"

      - name: Android paketini derle (AAB)
        run: |
          npx --yes eas-cli@25 build --platform android --profile production --non-interactive --wait --json > build.json
          node -e "
            const b = require('./build.json')[0];
            const out = [
              '### Android derlemesi ✅',
              '- Sürüm: ' + b.appVersion + ' (' + b.appBuildVersion + ')',
              '- AAB dosyası: ' + (b.artifacts && b.artifacts.buildUrl || '-'),
              '- Expo proje numarası: ${{ env.PROJECT_ID }}'
            ].join('\n');
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, out + '\n');
            console.log(out);
          "

      - name: Google Play'e gönder (dahili test)
        if: ${{ inputs.submit }}
        run: npx --yes eas-cli@25 submit --platform android --profile production --latest --non-interactive
